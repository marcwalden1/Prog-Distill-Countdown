# Conda environment for RL-skill-comp (Countdown GRPO/PPO + distillation).
# Exact clone of the `verl` env used on the Kempner cluster (Python 3.10).
#
#   conda env create -f environment.yml   # creates env named `verl`
#
# CAVEATS (see requirements.txt header and CLAUDE.md for detail):
#   - torch/flashinfer are CUDA 12.4 builds; the pip `--extra-index-url` lines
#     below point at the PyTorch cu124 index so they resolve.
#   - verl is installed editable from a pinned fork commit, and STILL needs the
#     local uncommitted patches documented in CLAUDE.md ("Local verl + vLLM
#     patches") to run correctly.
name: verl
channels:
  - defaults
  - conda-forge
dependencies:
  - _openmp_mutex=4.5
  - bzip2=1.0.8
  - ca-certificates=2026.2.25
